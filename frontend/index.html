<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Manager</h1>
        <p>Project & Task Management</p>
    </header>

    <main>
        <section>
            <div class="section-header">
                <h2>My Projects</h2>
                <button id="new-project-button">
                    + New Project
                </button>
            </div>

            <div id="projects-container">
                <p>Loading projects...</p>
            </div>

            <div id="project-form-container" class="hidden">
                <h3>Create a New Project</h3>

                <form id="project-form">

                    <label for="project-name">Project Name</label>
                    <input
                        type="text"
                        id="project-name"
                        required
                    >

                    <label for="project-description">Description</label>
                    <textarea
                        id="project-description"
                        rows="4"
                    ></textarea>

                    <div class="form-buttons">
                        <button type="submit">Create Project</button>
                        <button type="button" id="cancel-project-button">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </section>
        <section id="tasks-section" class="hidden">
            <div class="section-header">
                <h2 id="tasks-title">Tasks</h2>
                <button id="new-task-button">
                    + New Task
                </button>
            </div>

            <div id="tasks-container">
                <p>No tasks yet.</p>
            </div>

            <div id="task-form-container" class="hidden">
                <h3>Create a New Task</h3>

                <form id="task-form">
                    <label for="task-title">Task Title</label>
                    <input type="text" id="task-title" required>

                    <label for="task-description">Description</label>
                    <textarea id="task-description" rows="4"></textarea>

                    <label for="task-status">Status</label>
                    <select id="task-status">
                        <option value="To Do">To Do</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>

                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>

                    <div class="form-buttons">
                        <button type="submit">Create Task</button>
                        <button type="button" id="cancel-task-button">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="app.js"></script>

</body>
</html>
